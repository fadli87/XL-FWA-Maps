<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>XL SATU Coverage, Building & Tower BTS Cilacap</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b111e;
      color: #e2e8f0;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Floating Panel */
    header {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 8px 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #0052cc, #00c6ff);
      color: white;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(0, 198, 255, 0.35);
    }

    .app-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
    }

    .app-subtitle {
      font-size: 10px;
      color: #94a3b8;
    }

    /* Controls row: Filter & Search */
    .controls-row {
      display: flex;
      gap: 8px;
    }

    .select-district {
      flex: 1.1;
      height: 38px;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 500;
      padding: 0 8px;
      outline: none;
      cursor: pointer;
    }

    .select-district option {
      background: #0f172a;
      color: #f1f5f9;
    }

    .search-container {
      position: relative;
      flex: 1.3;
    }

    .search-input {
      width: 100%;
      height: 38px;
      padding: 0 30px 0 10px;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    .search-input:focus, .select-district:focus {
      border-color: #00c6ff;
      box-shadow: 0 0 0 2px rgba(0, 198, 255, 0.25);
    }

    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
      display: none;
    }

    /* Map Container */
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Floating Action Buttons */
    .fab-group {
      position: absolute;
      bottom: 24px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .fab {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .fab:active {
      transform: scale(0.92);
      background: #0052cc;
    }

    .fab svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Bottom Info Card */
    .bottom-info-card {
      position: absolute;
      bottom: 24px;
      left: 12px;
      right: 68px;
      z-index: 1000;
      font-size: 11px;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #cbd5e1;
      font-weight: 500;
    }

    .stat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot-building { background: #00ff88; box-shadow: 0 0 6px #00ff88; }
    .dot-coverage { background: #00c6ff; box-shadow: 0 0 6px #00c6ff; }
    .dot-tower { background: #ff007a; box-shadow: 0 0 6px #ff007a; }

    /* Custom Leaflet Controls */
    .leaflet-control-layers {
      background: rgba(15, 23, 42, 0.94) !important;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 12px !important;
      color: #e2e8f0 !important;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5) !important;
      font-size: 12px !important;
      padding: 8px 12px !important;
    }

    .leaflet-control-layers-expanded {
      margin-top: 105px !important;
      margin-right: 12px !important;
    }

    /* Popups */
    .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.96) !important;
      backdrop-filter: blur(12px) !important;
      border: 1px solid rgba(255, 255, 255, 0.16) !important;
      border-radius: 14px !important;
      color: #f1f5f9 !important;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6) !important;
      padding: 2px !important;
    }

    .leaflet-popup-content {
      margin: 10px 12px !important;
      font-size: 12px;
      line-height: 1.45;
    }

    .leaflet-popup-tip {
      background: rgba(15, 23, 42, 0.96) !important;
    }

    .popup-title {
      font-size: 13px;
      font-weight: 700;
      color: #00c6ff;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px;
    }

    .popup-title.building { color: #00ff88; }
    .popup-title.tower { color: #ff3399; }

    .popup-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 3px 0;
    }

    .popup-label {
      color: #94a3b8;
    }

    .popup-value {
      font-weight: 600;
      color: #f8fafc;
      text-align: right;
    }

    /* Loading Spinner */
    #loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 2000;
      background: #0b111e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 198, 255, 0.15);
      border-top-color: #00c6ff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
    }

    /* Marker Cluster Styling */
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
      background-color: rgba(255, 0, 122, 0.35) !important;
    }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background-color: #ff007a !important;
      color: #fff !important;
      font-weight: 700 !important;
      font-size: 11px !important;
    }

    /* Custom Tower Marker */
    .custom-tower-marker {
      background: transparent !important;
      border: none !important;
    }

    .tower-pin {
      width: 28px;
      height: 28px;
      border: 2px solid #ffffff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .tower-pin:hover {
      transform: rotate(-45deg) scale(1.18);
    }

    .tower-svg {
      width: 16px;
      height: 16px;
      transform: rotate(45deg);
    }

    /* Custom Homepass / Building Marker */
    .custom-home-marker {
      background: transparent !important;
      border: none !important;
    }

    .home-pin {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.45);
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .home-pin:hover {
      transform: scale(1.4);
      z-index: 1000 !important;
    }

    .home-svg {
      width: 10px;
      height: 10px;
    }

    .home-indoor {
      background: linear-gradient(135deg, #00e676, #009944);
      box-shadow: 0 2px 8px rgba(0, 230, 118, 0.6);
    }

    .home-outdoor {
      background: linear-gradient(135deg, #ff9100, #cc6600);
      box-shadow: 0 2px 8px rgba(255, 145, 0, 0.6);
    }

    .home-ftth {
      background: linear-gradient(135deg, #d500f9, #8e00ab);
      box-shadow: 0 2px 8px rgba(213, 0, 249, 0.6);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Loading Screen -->
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-text">Memuat peta & data BTS...</div>
    </div>

    <!-- Header Navigation & Filter -->
    <header>
      <div class="glass-panel">
        <div class="header-top">
          <div class="brand-group">
            <div class="brand-badge">XL SATU</div>
            <div>
              <div class="app-title">Coverage, Building & BTS</div>
              <div class="app-subtitle">Kab. Cilacap (Sales Field Mobile Edition)</div>
            </div>
          </div>
        </div>
      </div>

      <div class="glass-panel" style="padding: 6px 8px;">
        <div class="controls-row">
          <select id="district-select" class="select-district">
            <option value="">Pilih Kecamatan...</option>
          </select>
          <div class="search-container">
            <input type="text" id="search-box" class="search-input" placeholder="🔍 Cari Desa, Cluster, ID, BTS..." />
            <button id="search-clear" class="search-clear">&times;</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Map Viewport -->
    <div id="map"></div>

    <!-- Bottom Stat Card -->
    <div class="glass-panel bottom-info-card">
      <div class="stat-badge">
        <span class="stat-dot dot-building"></span>
        <span id="building-stat">0 Building</span>
      </div>
      <div class="stat-badge">
        <span class="stat-dot dot-coverage"></span>
        <span id="coverage-stat">0 Coverage</span>
      </div>
      <div class="stat-badge">
        <span class="stat-dot dot-tower"></span>
        <span id="tower-stat">380 Tower BTS</span>
      </div>
    </div>

    <!-- Floating Action Buttons -->
    <div class="fab-group">
      <button class="fab" id="btn-gps" title="Lokasi Saya">
        <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
      </button>
      <button class="fab" id="btn-reset" title="Reset View">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.95 20 14.54 20 13c0-4.42-3.58-8-8-8zm-6 8c0-1.01.25-1.97.7-2.8L5.24 8.74C4.46 10.05 4 11.46 4 13c0 4.42 3.58 8 8 8v4l5-5-5-5v4c-3.31 0-6-2.69-6-6z"/></svg>
      </button>
    </div>
  </div>

  <!-- Leaflet & Plugin Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    const CILACAP_CENTER = [-7.7279, 109.0069];
    const DEFAULT_ZOOM = 11;

    // Hardware-accelerated Canvas Map
    const map = L.map('map', {
      center: CILACAP_CENTER,
      zoom: DEFAULT_ZOOM,
      zoomControl: false,
      preferCanvas: true
    });

    // Basemaps
    const googleStreets = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '&copy; Google Maps'
    }).addTo(map);

    const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '&copy; Google Maps'
    });

    const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; CARTO'
    });

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    });

    // Layer Groups
    const buildingLayerGroup = L.layerGroup().addTo(map);
    const coverageLayerGroup = L.layerGroup().addTo(map);
    const towerClusterGroup = L.markerClusterGroup({
      chunkedLoading: true,
      maxClusterRadius: 40,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false
    }).addTo(map);

    L.control.layers(
      { "Google Streets": googleStreets, "Google Satelit": googleHybrid, "Dark Mode": darkLayer, "OpenStreetMap": osm },
      { "🏠 Titik Building / Target": buildingLayerGroup, "📶 Area Coverage": coverageLayerGroup, "📡 Tower BTS XL": towerClusterGroup },
      { position: 'topright' }
    ).addTo(map);

    // Data State
    let allTowers = [];
    let currentCoverageLayer = null;
    let currentBuildingLayer = null;
    let currentBuildingsData = [];
    let districtSummaryData = {};
    let userLocationMarker = null;
    let userLocationCircle = null;

    async function initApp() {
      const loadingOverlay = document.getElementById('loading-overlay');
      const loadingText = document.getElementById('loading-text');

      try {
        // 1. Fetch Tower Data (Ultra fast, 106 KB)
        loadingText.innerText = "Memuat data 380 Tower BTS...";
        const towerRes = await fetch('tower.geojson');
        if (towerRes.ok) {
          const towerGeojson = await towerRes.json();
          allTowers = towerGeojson.features;
          renderTowers(allTowers);
          document.getElementById('tower-stat').innerText = `${allTowers.length} BTS Tower`;
        }

        // 2. Fetch District Summary for dropdown (1.7 KB)
        loadingText.innerText = "Menyiapkan daftar kecamatan...";
        try {
          const distRes = await fetch('districts.json');
          if (distRes.ok) {
            districtSummaryData = await distRes.json();
            populateDistrictSelect(districtSummaryData);
          }
        } catch (e) {
          console.warn("Districts json not loaded:", e);
        }

      } catch (err) {
        console.error("Gagal memuat peta:", err);
      } finally {
        // Immediately dismiss loading overlay (Page loads in 0.1s!)
        loadingOverlay.style.opacity = '0';
        setTimeout(() => { loadingOverlay.style.display = 'none'; }, 200);
      }
    }

    function populateDistrictSelect(summary) {
      const select = document.getElementById('district-select');
      select.innerHTML = '<option value="">-- 📍 Pilih Kecamatan untuk Tampilkan Data --</option>';
      const districts = Object.keys(summary).sort();
      districts.forEach(dist => {
        const item = summary[dist];
        const bCount = item.buildings || 0;
        const cCount = item.coverage || 0;
        const opt = document.createElement('option');
        opt.value = dist;
        opt.innerText = `📍 ${dist} (${bCount.toLocaleString()} Homepass / ${cCount.toLocaleString()} Cov)`;
        select.appendChild(opt);
      });
    }

    function getTowerIcon(color) {
      const pinColor = color || '#ff007a';
      return L.divIcon({
        className: 'custom-tower-marker',
        html: `
          <div class="tower-pin" style="background: ${pinColor}; box-shadow: 0 4px 14px ${pinColor}aa;">
            <svg viewBox="0 0 24 24" class="tower-svg">
              <circle cx="12" cy="3" r="1.5" fill="white"/>
              <path d="M12 4.5v16.5M8 8l4-3.5 4 3.5M7 13l5-4 5 4M6 18l6-4.5 6 4.5M4 21h16" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
        `,
        iconSize: [28, 28],
        iconAnchor: [14, 28],
        popupAnchor: [0, -28]
      });
    }

    function getBuildingIcon(net) {
      net = (net || '').toLowerCase();
      let colorClass = 'home-indoor';
      if (net.includes('outdoor') && !net.includes('indoor')) {
        colorClass = 'home-outdoor';
      } else if (net.includes('ftth')) {
        colorClass = 'home-ftth';
      }

      return L.divIcon({
        className: 'custom-home-marker',
        html: `
          <div class="home-pin ${colorClass}">
            <svg viewBox="0 0 24 24" class="home-svg">
              <path d="M12 3L2 12h3v8h5v-5h4v5h5v-8h3L12 3z" fill="white"/>
            </svg>
          </div>
        `,
        iconSize: [16, 16],
        iconAnchor: [8, 8],
        popupAnchor: [0, -8]
      });
    }

    function renderTowers(features) {
      towerClusterGroup.clearLayers();

      features.forEach(feat => {
        const [lng, lat] = feat.geometry.coordinates;
        const p = feat.properties;

        const marker = L.marker([lat, lng], {
          icon: getTowerIcon(p.color)
        });

        const popup = `
          <div class="popup-title tower" style="color: ${p.color || '#ff3399'}; border-bottom: 2px solid ${p.color || '#ff3399'};">🗼 ${p.name || 'Tower BTS XL'}</div>
          <div class="popup-row"><span class="popup-label">Tower ID:</span><span class="popup-value">${p.tower_id || '-'}</span></div>
          <div class="popup-row"><span class="popup-label">eNodeB ID:</span><span class="popup-value">${p.enbid || '-'}</span></div>
          <div class="popup-row"><span class="popup-label">Kecamatan:</span><span class="popup-value">${p.district || '-'}</span></div>
          <div class="popup-row"><span class="popup-label">RAN Type:</span><span class="popup-value">${p.ran_type || '-'}</span></div>
          <div class="popup-row"><span class="popup-label">5G Ready:</span><span class="popup-value">${p.city_5g || '-'}</span></div>
          <div class="popup-row"><span class="popup-label">Tinggi Tower:</span><span class="popup-value">${p.antenna_height ? p.antenna_height + ' m' : '-'}</span></div>
          <div class="popup-row"><span class="popup-label">SPV:</span><span class="popup-value">${p.spv || '-'}</span></div>
          <div class="popup-row"><span class="popup-label">Payload:</span><span class="popup-value">${p.payload || '-'}</span></div>
        `;

        marker.bindPopup(popup);
        marker.featureData = p;
        towerClusterGroup.addLayer(marker);
      });
    }

    async function loadDistrictData(distName) {
      const safeName = distName.replace(/[^a-zA-Z0-9_]/g, '_');

      // 1. Fetch Coverage
      try {
        const res = await fetch(`coverage/${safeName}.geojson`);
        if (res.ok) {
          const distGeojson = await res.json();
          renderCoverage(distGeojson);
          document.getElementById('coverage-stat').innerText = `${distGeojson.features.length} Coverage`;
          if (currentCoverageLayer && distGeojson.features.length > 0) {
            map.fitBounds(currentCoverageLayer.getBounds(), { maxZoom: 14, padding: [20, 20] });
          }
        } else {
          renderCoverage({ features: [] });
          document.getElementById('coverage-stat').innerText = `0 Coverage`;
        }
      } catch (err) {
        console.error("Gagal load coverage:", err);
      }

      // 2. Fetch Buildings
      try {
        const bRes = await fetch(`buildings/${safeName}.geojson`);
        if (bRes.ok) {
          const bGeojson = await bRes.json();
          currentBuildingsData = bGeojson.features;
          renderBuildings(bGeojson);
          document.getElementById('building-stat').innerText = `${bGeojson.features.length} Building`;
        } else {
          renderBuildings({ features: [] });
          document.getElementById('building-stat').innerText = `0 Building`;
        }
      } catch (err) {
        console.error("Gagal load buildings:", err);
      }
    }

    function renderCoverage(geojson) {
      if (currentCoverageLayer) {
        coverageLayerGroup.removeLayer(currentCoverageLayer);
      }

      currentCoverageLayer = L.geoJSON(geojson, {
        style: {
          color: '#0052cc',
          weight: 1,
          opacity: 0.8,
          fillColor: '#00c6ff',
          fillOpacity: 0.22
        },
        onEachFeature: function(feature, layer) {
          const p = feature.properties;
          const popup = `
            <div class="popup-title">📶 Coverage Area</div>
            <div class="popup-row"><span class="popup-label">Kecamatan:</span><span class="popup-value">${p.d || '-'}</span></div>
            <div class="popup-row"><span class="popup-label">Network:</span><span class="popup-value">${p.net || '-'}</span></div>
          `;
          layer.bindPopup(popup);
        }
      });

      coverageLayerGroup.addLayer(currentCoverageLayer);
    }

    function renderBuildings(geojson) {
      if (currentBuildingLayer) {
        buildingLayerGroup.removeLayer(currentBuildingLayer);
      }

      currentBuildingLayer = L.geoJSON(geojson, {
        pointToLayer: function(feature, latlng) {
          const net = (feature.properties.net || '').toLowerCase();
          let fillColor = '#00ff88'; // Green: Indoor/Outdoor
          if (net.includes('outdoor') && !net.includes('indoor')) {
            fillColor = '#ffaa00'; // Orange: Outdoor
          } else if (net.includes('ftth')) {
            fillColor = '#d500f9'; // Purple: FTTH
          }

          return L.circleMarker(latlng, {
            radius: 4,
            fillColor: fillColor,
            color: '#ffffff',
            weight: 0.8,
            opacity: 0.95,
            fillOpacity: 0.85
          });
        },
        onEachFeature: function(feature, layer) {
          const p = feature.properties;
          const popup = `
            <div class="popup-title building">🏠 Homepass / Building Prospect</div>
            <div class="popup-row"><span class="popup-label">Building ID:</span><span class="popup-value">${p.id || '-'}</span></div>
            <div class="popup-row"><span class="popup-label">Kategori:</span><span class="popup-value">${p.cat || '-'}</span></div>
            <div class="popup-row"><span class="popup-label">Prioritas:</span><span class="popup-value">${p.prio || '-'}</span></div>
            <div class="popup-row"><span class="popup-label">Jaringan:</span><span class="popup-value">${p.net || '-'}</span></div>
            <div class="popup-row"><span class="popup-label">Homepass:</span><span class="popup-value">${p.hp || '-'}</span></div>
            <div class="popup-row"><span class="popup-label">Desa:</span><span class="popup-value">${p.v || '-'}</span></div>
            <div class="popup-row"><span class="popup-label">Kecamatan:</span><span class="popup-value">${p.d || '-'}</span></div>
            <div class="popup-row"><span class="popup-label">Cluster:</span><span class="popup-value">${p.c || '-'}</span></div>
          `;
          layer.bindPopup(popup);
        }
      });

      buildingLayerGroup.addLayer(currentBuildingLayer);
    }

    // District Selector Event
    document.getElementById('district-select').addEventListener('change', async (e) => {
      const selected = e.target.value;
      if (selected) {
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        loadingOverlay.style.display = 'flex';
        loadingOverlay.style.opacity = '1';
        loadingText.innerText = `Memuat data Kecamatan ${selected}...`;

        await loadDistrictData(selected);

        loadingOverlay.style.opacity = '0';
        setTimeout(() => { loadingOverlay.style.display = 'none'; }, 250);
      }
    });

    // Search Box Event
    const searchBox = document.getElementById('search-box');
    const searchClear = document.getElementById('search-clear');

    searchBox.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      searchClear.style.display = q ? 'block' : 'none';
      if (!q || q.length < 2) return;

      // 1. Search Tower
      const matchedTower = allTowers.find(feat => {
        const p = feat.properties || {};
        return (p.name && p.name.toLowerCase().includes(q)) ||
               (p.tower_id && p.tower_id.toLowerCase().includes(q)) ||
               (p.enbid && p.enbid.toLowerCase().includes(q));
      });

      if (matchedTower) {
        const [lng, lat] = matchedTower.geometry.coordinates;
        map.setView([lat, lng], 16);
        return;
      }

      // 2. Search Building in current district
      if (currentBuildingsData.length > 0) {
        const matchedBldg = currentBuildingsData.find(feat => {
          const p = feat.properties || {};
          return (p.id && p.id.toLowerCase().includes(q)) ||
                 (p.v && p.v.toLowerCase().includes(q)) ||
                 (p.c && p.c.toLowerCase().includes(q));
        });

        if (matchedBldg) {
          const [lng, lat] = matchedBldg.geometry.coordinates;
          map.setView([lat, lng], 18);
        }
      }
    });

    searchClear.addEventListener('click', () => {
      searchBox.value = '';
      searchClear.style.display = 'none';
    });

    // GPS Button
    document.getElementById('btn-gps').addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert("Geolocation tidak didukung pada perangkat ini.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const accuracy = pos.coords.accuracy;

          if (userLocationMarker) map.removeLayer(userLocationMarker);
          if (userLocationCircle) map.removeLayer(userLocationCircle);

          userLocationCircle = L.circle([lat, lng], {
            radius: accuracy,
            color: '#00c6ff',
            fillColor: '#00c6ff',
            fillOpacity: 0.15
          }).addTo(map);

          userLocationMarker = L.circleMarker([lat, lng], {
            radius: 8,
            color: '#ffffff',
            fillColor: '#0052cc',
            fillOpacity: 1,
            weight: 3
          }).addTo(map).bindPopup(`<b>📍 Lokasi Anda</b><br>Akurasi: ±${Math.round(accuracy)}m`).openPopup();

          map.setView([lat, lng], 16);
        },
        (err) => {
          alert(`Gagal mengambil GPS: ${err.message}`);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    // Reset View
    document.getElementById('btn-reset').addEventListener('click', () => {
      map.setView(CILACAP_CENTER, DEFAULT_ZOOM);
    });

    // Init App
    initApp();
  </script>
</body>
</html>
